version: "3"

vars:
  PYTHON: '{{if eq OS "windows"}}.venv/Scripts/python.exe{{else}}.venv/bin/python{{end}}'

tasks:
  setup:
    desc: Create virtual environment and install dependencies
    cmds:
      - python -m venv .venv
      - python -m pip install --upgrade pip
      - python -m pip install -r requirements.txt

  docker:up:
    desc: Start Docker services
    cmds:
      - docker compose up -d

  docker:reset:
    desc: Reset Docker services and database state
    cmds:
      - docker compose down -v
      - docker compose up -d

  dev:
    desc: Run FastAPI development server
    cmds:
      - python -m uvicorn app.main:app --reload --port 8000

  test:
    desc: Run test suite
    cmds:
      - python -m pytest -q

  ruff:
    desc: Chạy Ruff lint nhanh
    cmds:
      - "{{.PYTHON}} -m ruff check app tests alembic"
