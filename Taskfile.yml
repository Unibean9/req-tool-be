version: "3"

tasks:
  setup:
    desc: Sync the uv environment
    cmds:
      - uv sync

  docker:up:
    desc: Start Docker services
    cmds:
      - docker compose -f docker/docker-compose.dev.yml --env-file docker/.env up -d

  docker:reset:
    desc: Reset Docker services and database state
    cmds:
      - docker compose -f docker/docker-compose.dev.yml --env-file .env down -v
      - docker compose -f docker/docker-compose.dev.yml --env-file .env up -d

  dev:
    desc: Run FastAPI development server
    cmds:
      - docker compose -f docker/docker-compose.dev.yml --env-file .env up -d && uv run uvicorn app.main:app --reload --port 8000

  test:
    desc: Run test suite
    cmds:
      - uv run pytest -q

  ruff:
    desc: Run quick Ruff lint
    cmds:
      - uv run ruff check app tests alembic
