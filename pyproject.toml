[project]
name = "req-tool-be"
version = "0.1.0"
description = "Requirements analysis backend."
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14.0",
    "anthropic>=0.97.0",
    "asyncpg>=0.30.0",
    "bcrypt>=4.0.1",
    "boto3>=1.34.0",
    "cryptography>=44.0.0",
    "fastapi>=0.115.0",
    "google-genai>=2.7.0",
    "httpx>=0.28.0",
    "langchain-core==1.4.8",
    "langgraph==1.2.6",
    "mistralai>=1.0.0",
    "openai>=2.40.0",
    "pydantic[email]>=2.11.0",
    "pydantic-settings>=2.8.0",
    "pyjwt>=2.8.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0.40",
    "uvicorn[standard]>=0.34.0",
    "jsonschema>=4.26.0",
]

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
]
lint = [
    "ruff>=0.12.0",
]
test = [
    "aiosqlite>=0.20.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["alembic"]
# Honor extend-exclude even when paths are passed explicitly (CI runs `ruff check app tests alembic`).
force-exclude = true

[tool.ruff.lint]
select = ["F", "E", "I", "ARG", "ERA", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately have long assertion/mock-data lines, receive pytest fixtures
# for their side effects (unused params), and assert on broad exception types.
"tests/**" = ["E501", "ARG001", "ARG002", "B017"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection callables are evaluated at call time by design;
# they are not B008 mutable-default bugs.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Security",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -m \"not eval and not benchmark and not live and not golden and not evidence\""
pythonpath = ["."]
markers = [
    "integration: Cross-layer tests that exercise API, DB, graph, or service composition",
    "eval: Behavior quality measurement suite; run explicitly with -m eval",
    "golden: Snapshot or golden-contract checks; run explicitly with -m golden",
    "benchmark: Performance, latency, or token evidence checks; run explicitly with -m benchmark",
    "live: Tests that call a real external LLM or judge; run explicitly with -m live and credentials",
    "evidence: Tests that write transcripts, metrics, benchmark reports, or other evidence artifacts",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/alembic/*",
    "app/main.py",
    "app/eval/*",
]

[tool.coverage.report]
show_missing = true
