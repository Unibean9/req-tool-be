name: req.bean9.net
services:
  postgres:
    image: postgres:16-alpine
    container_name: reqflow_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: reqflow
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reqflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgweb:
    image: sosedoff/pgweb
    container_name: reqflow_web
    restart: unless-stopped
    environment:
      PGWEB_DATABASE_URL: postgresql://postgres:password@postgres:5432/reqflow?sslmode=disable
    ports:
      - "8080:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
